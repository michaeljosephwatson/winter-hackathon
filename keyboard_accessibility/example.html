<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text Game (Keyboard Accessible)</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Skip link -->
    <a class="skip-link" href="#main">Skip to game</a>

    <header class="border-bottom">
      <div class="container py-3">
        <h1 class="h3 mb-0">Text Adventure</h1>
        <p class="text-muted mb-0">
          Type commands (e.g., <kbd>look</kbd>, <kbd>go north</kbd>, <kbd>help</kbd>).
        </p>
      </div>
    </header>

    <main id="main" class="container my-4" tabindex="-1">
      <div class="row g-4">
        <!-- Main transcript -->
        <section class="col-lg-8" aria-labelledby="transcriptTitle">
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h2 id="transcriptTitle" class="h5 mb-0">Transcript</h2>

              <!-- Button is keyboard accessible -->
              <button id="btnClear" type="button" class="btn btn-sm btn-outline-secondary">
                Clear
              </button>
            </div>

            <!-- Announcements -->
            <div
              id="log"
              class="card-body game-log"
              role="log"
              aria-live="polite"
              aria-relevant="additions text"
              aria-atomic="false"
              tabindex="0"
            >
              <p class="mb-2"><strong>Game:</strong> You wake in a small room. A door leads north.</p>
              <p class="mb-0"><strong>Tip:</strong> Press <kbd>/</kbd> to jump to the command box.</p>
            </div>

            <div class="card-footer">
              <form id="commandForm" class="d-flex gap-2" autocomplete="off">
                <label class="visually-hidden" for="commandInput">Command</label>
                <input
                  id="commandInput"
                  class="form-control"
                  name="command"
                  type="text"
                  inputmode="text"
                  spellcheck="false"
                  aria-describedby="commandHelp"
                  placeholder="Type a command…"
                />
                <button class="btn btn-primary" type="submit">Send</button>
              </form>

              <div id="commandHelp" class="form-text">
                Keyboard: <kbd>Enter</kbd> send · <kbd>↑</kbd>/<kbd>↓</kbd> history · <kbd>/</kbd> focus input
              </div>
            </div>
          </div>
        </section>

        <!-- State and quick actions -->
        <aside class="col-lg-4" aria-labelledby="stateTitle">
          <div class="card mb-4">
            <div class="card-header">
              <h2 id="stateTitle" class="h5 mb-0">Game State</h2>
            </div>
            <div class="card-body">
              <dl class="row mb-0">
                <dt class="col-5">Location</dt>
                <dd class="col-7" id="stateLocation">Room</dd>

                <dt class="col-5">Health</dt>
                <dd class="col-7" id="stateHealth">10</dd>
              </dl>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="h5 mb-0">Quick Commands</h2>
            </div>
            <div class="card-body d-grid gap-2">
              <!-- Buttons are focusable, have clear labels, and work with Enter/Space -->
              <button type="button" class="btn btn-outline-primary" data-cmd="look">
                Look
              </button>
              <button type="button" class="btn btn-outline-primary" data-cmd="go north">
                Go North
              </button>
              <button type="button" class="btn btn-outline-primary" data-cmd="help">
                Help
              </button>
            </div>
          </div>

          <!-- Screen-reader-only announcements -->
          <div id="srStatus" class="visually-hidden" aria-live="assertive"></div>
        </aside>
      </div>
    </main>
</div>

    <script src="script.js" defer></script>
  </body>
</html>
