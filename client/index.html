<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta tags provide information about the page to browsers and search engines -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The title appears in the browser tab -->
    <title>Hackathon Starter</title>

    <!-- Bootstrap CSS: A popular framework for styling websites quickly -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS: Your own styles go here -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Navigation: The bar at the top of the page -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Empathy Game</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Features</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero Section: A large, prominent section at the top of the page -->
    <section id="homePage" class="hero bg-primary text-white text-center py-5">
      <div class="container">
        <h1 class="display-4 fw-bold">A short tail of empathy</h1>
        <p class="lead">Enter your name to continue</p>
        <input type="text" id="userName" name="fname">
        <!-- id="cta-button" allows us to find this button in script.js -->
        <button class="btn btn-light btn-lg" id="cta-button">
          Confirm
        </button>
      </div>
    </section>

    <!-- Main Content: The primary information on your page -->
    <div class="hide" id="mainPage">
      <main class="py-5">
        <div class="container text-center mb-4">
          <h2 id="gameStateTitle">
            What will you do?
          </h2>
            <p id="gameStateText">
              You see someone in trouble. How do you respond?
            </p>
        </div>

        <div class="container">
          <!-- row and col-md-4 are Bootstrap classes for creating a grid layout -->
          <div class="row g-4">
            <!-- Each col-md-4 takes up 4 out of 12 columns (1/3 of the width) -->
            <div id="buttons" class="col-md-4">
              <button id="buttonOne"
                      class="card" 
                      onclick="optionOne()"
                      type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#navbarNav"
              >
                <div class="card-body">
                  <h5 class="card-title">Be kind</h5>
                  <p class="card-text">
                    Do something kind...
                  </p>
                </div>
              </button>
            </div>
            <div class="col-md-4">
              <button id="buttonTwo"
                      class="card" 
                      onlclick="optionTwo()"
                      type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#navbarNav"
              >
                <div class="card-body">
                  <h5 class="card-title">Be Neutral</h5>
                  <p class="card-text">
                    Do something neutral...
                  </p>
                </div>
              </button>
            </div>
            <d class="col-md-4">
              <button id="buttonThree"
                      class="card"
                      onclick="optionThree()"
                      type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#navbarNav"
              >
                <div class="card-body">
                  <h5 class="card-title">Be mean</h5>
                  <p class="card-text">
                    Do something mean...
                  </p>
                </div>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
   

    <!-- Footer: Information at the bottom of the page -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
      <div class="container">
        <p>&copy; 2025 Hackathon Starter. All rights reserved.</p>
      </div>
    </footer>

    <!-- Bootstrap JS: Required for interactive components like the mobile menu -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS: Your own interactive code goes here -->
    <script src="script.js"></script>
  </body>
</html>
